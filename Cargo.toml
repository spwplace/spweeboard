[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/spwashi/spweeboard"

[workspace.dependencies]
# Core
thiserror = "2"
derive_more = { version = "1", features = ["full"] }
smallvec = { version = "1.13", features = ["union", "const_generics", "const_new", "serde"] }
compact_str = { version = "0.8", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }

# Async
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# FFI
uniffi = "0.28"

# LLM (feature-gated per platform)
llama-cpp-2 = "0.1"
regex = "1"
rand = "0.8"

# IPC server (main app)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-stream = "0.1"

# IPC client (keyboard extension)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
